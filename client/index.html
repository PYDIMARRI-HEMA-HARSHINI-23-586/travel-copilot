<!doctype html>
<html>
  <head>
    <title>TBO Virtual Travel Copilot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 🔥 TOP NAVBAR -->
    <div class="navbar">
      <div class="logo">✈️ TBO Virtual Travel Copilot</div>
      <div class="agent-info">
        <span id="agentName"></span>
        <a href="#" onclick="editAgentName()" style="color: #38bdf8; font-size: 12px; margin-left: 10px; text-decoration: none;">(Edit)</a>
      </div>
    </div>
    <div class="app">
      <!-- LEFT PANEL -->
      <div class="sidebar">
        <h3>Saved Chats</h3>
        <input
          type="text"
          id="searchChat"
          placeholder="Search customer..."
          oninput="filterChats()"
          style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;"
        />
        <ul id="chatList"></ul>
        <button onclick="newChat()">+ New Chat</button>
      </div>

      <!-- MIDDLE PANEL -->
      <div class="chat-section">
        <div id="chatWindow" class="chat-window"></div>

        <div class="input-area">
          <input
            type="text"
            id="query"
            placeholder="Type customer request..."
          />
          <button onclick="sendQuery()">Send</button>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="recommendation-section">
        <h3>Booking Insights</h3>
        <div id="response"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
